# Test and publish the image to GitHub Container Registry (ghcr.io/<owner>/<repo>).
#   pull request:   test (vet, race, e2e), ui (Playwright) and scan (Trivy); build but do not publish the image.
#   push to main:   test and scan, then image tagged main and sha-<commit>.
#   tag vX.Y.Z:     test and scan, then image tagged X.Y.Z, X.Y and latest.
# Multi-architecture image (linux/amd64, linux/arm64) with Go cross-compilation, SBOM and
# provenance. Uses GITHUB_TOKEN: no secrets to configure.
# The scan job fails on HIGH or CRITICAL vulnerabilities with a fix available: a base image or
# Go standard library advisory is cleared by a version bump, not by muting the finding.
# Actions are pinned to commit SHAs (version in comments): update SHA and comment together.
name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Matches the Dockerfile builder.
  GO_VERSION: "1.27.4"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # No external dependencies (no go.sum): module caching is unnecessary.
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      # aria2c exercises the third printed row; busybox tests wget on minimal systems.
      # curl, wget and python3 are already available. The e2e ends with scripts/invariant.py
      # (source preservation), which fails on missing tools when BASHT_INV_REQUIRE is set.
      - name: e2e
        env:
          BASHT_INV_REQUIRE: curl,wget,aria2c,busybox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 busybox
          bash scripts/e2e.sh

  # Frontend tests with Playwright (headless Chromium, playwright-core pinned in scripts/ui):
  # pages, browser upload and page download, directly and through Apache 2.4/h2c
  # (httpd image pinned by digest in scripts/ui/run.sh). Preserve screenshots and files as
  # artifacts if a test fails.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: playwright
        working-directory: scripts/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps --no-shell chromium

      - name: ui (direct)
        env:
          BASHT_UI_OUT: ${{ runner.temp }}/ui
        run: bash scripts/ui/run.sh direct

      - name: ui (Apache)
        env:
          BASHT_UI_OUT: ${{ runner.temp }}/ui
        run: bash scripts/ui/run.sh apache

      - name: artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: ${{ runner.temp }}/ui
          retention-days: 7

  # Vulnerability gate on the same Dockerfile: amd64 image built locally, scanned with Trivy.
  # ignore-unfixed keeps release availability (Debian findings without a fix cannot be acted on);
  # any HIGH or CRITICAL with a fix fails the run, so the bump lands before publishing.
  scan:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bashtransfer:scan
          cache-from: type=gha

      - name: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bashtransfer:scan
          # Pinned scanner, updated with the action (version in the comment).
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  image:
    needs: [test, ui, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: login ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
          # latest only for release tags, not every push to main.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=bashtransfer
            org.opencontainers.image.description=Streaming file relay: send with curl -T, receive with curl/wget/aria2c, no disk storage.

      # Release shown in the page footer: vX.Y.Z on a tag, otherwise dev-<short commit>.
      - name: version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=$GITHUB_REF_NAME; else v=dev-${GITHUB_SHA::7}; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
