# Test e pubblicazione dell'immagine su GitHub Container Registry (ghcr.io/<owner>/<repo>).
#   pull request:   test (vet, race, e2e); l'immagine viene costruita ma non pubblicata.
#   push su main:   test, poi immagine con tag main e sha-<commit>.
#   tag vX.Y.Z:     test, poi immagine con tag X.Y.Z, X.Y e latest.
# Immagine multi-architettura (linux/amd64, linux/arm64) con cross-compilazione Go, SBOM e
# provenance. Il token è GITHUB_TOKEN: nessun secret da configurare.
name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Allineata al builder del Dockerfile.
  GO_VERSION: "1.27.3"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      # aria2c esercita la terza riga dei comandi stampati; curl, wget e python3 sono già sul runner.
      - name: e2e
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2
          bash scripts/e2e.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: login ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
          # latest solo per i tag di release, non per ogni push su main.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=bashtransfer
            org.opencontainers.image.description=Relay di file in streaming: curl -T in invio, curl/wget/aria2c in ricezione, nessun salvataggio su disco.

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
