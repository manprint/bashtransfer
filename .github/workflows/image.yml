# Test e pubblicazione dell'immagine su GitHub Container Registry (ghcr.io/<owner>/<repo>).
#   pull request:   test (vet, race, e2e); l'immagine viene costruita ma non pubblicata.
#   push su main:   test, poi immagine con tag main e sha-<commit>.
#   tag vX.Y.Z:     test, poi immagine con tag X.Y.Z, X.Y e latest.
# Immagine multi-architettura (linux/amd64, linux/arm64) con cross-compilazione Go, SBOM e
# provenance. Il token è GITHUB_TOKEN: nessun secret da configurare.
# Action fissate per commit SHA (versione nel commento): aggiornarle insieme, SHA e commento.
name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Allineata al builder del Dockerfile.
  GO_VERSION: "1.27.3"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Nessuna dipendenza esterna (niente go.sum): la cache dei moduli non serve.
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      # aria2c esercita la terza riga dei comandi stampati, busybox il wget dei sistemi minimali;
      # curl, wget e python3 sono già sul runner. Alla fine l'e2e esegue scripts/invariant.py
      # (la sorgente non viene mai alterata), che con BASHT_INV_REQUIRE fallisce se ne manca uno.
      - name: e2e
        env:
          BASHT_INV_REQUIRE: curl,wget,aria2c,busybox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 busybox
          bash scripts/e2e.sh

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: login ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
          # latest solo per i tag di release, non per ogni push su main.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=bashtransfer
            org.opencontainers.image.description=Relay di file in streaming: curl -T in invio, curl/wget/aria2c in ricezione, nessun salvataggio su disco.

      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
