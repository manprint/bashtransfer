# Test and publish the image to GitHub Container Registry (ghcr.io/<owner>/<repo>).
#   pull request:   test (vet, race, e2e) and ui (Playwright); build but do not publish the image.
#   push to main:   test, then image tagged main and sha-<commit>.
#   tag vX.Y.Z:     test, then image tagged X.Y.Z, X.Y and latest.
# Multi-architecture image (linux/amd64, linux/arm64) with Go cross-compilation, SBOM and
# provenance. Uses GITHUB_TOKEN: no secrets to configure.
# Actions are pinned to commit SHAs (version in comments): update SHA and comment together.
name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Matches the Dockerfile builder.
  GO_VERSION: "1.27.3"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # No external dependencies (no go.sum): module caching is unnecessary.
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      # aria2c exercises the third printed row; busybox tests wget on minimal systems.
      # curl, wget and python3 are already available. The e2e ends with scripts/invariant.py
      # (source preservation), which fails on missing tools when BASHT_INV_REQUIRE is set.
      - name: e2e
        env:
          BASHT_INV_REQUIRE: curl,wget,aria2c,busybox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 busybox
          bash scripts/e2e.sh

  # Frontend tests with Playwright (headless Chromium, playwright-core pinned in scripts/ui):
  # pages, browser upload and page download, directly and through Apache 2.4/h2c
  # (httpd image pinned by digest in scripts/ui/run.sh). Preserve screenshots and files as
  # artifacts if a test fails.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: playwright
        working-directory: scripts/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps --no-shell chromium

      - name: ui (direct)
        env:
          BASHT_UI_OUT: ${{ runner.temp }}/ui
        run: bash scripts/ui/run.sh direct

      - name: ui (Apache)
        env:
          BASHT_UI_OUT: ${{ runner.temp }}/ui
        run: bash scripts/ui/run.sh apache

      - name: artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui
          path: ${{ runner.temp }}/ui
          retention-days: 7

  image:
    needs: [test, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: login ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
          # latest only for release tags, not every push to main.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=bashtransfer
            org.opencontainers.image.description=Streaming file relay: send with curl -T, receive with curl/wget/aria2c, no disk storage.

      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
