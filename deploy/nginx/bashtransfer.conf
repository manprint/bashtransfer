# nginx davanti ad app: TLS, redirect da 80, relay senza buffer e senza limite di body (R2).
# Certificati montati dall'host in /etc/nginx/certs; nessuna gestione certificati nel repository (D12).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Body illimitato e senza buffer: il relay inoltra i byte mentre arrivano.
    client_max_body_size      0;
    proxy_request_buffering   off;
    proxy_buffering           off;
    proxy_http_version        1.1;
    # Timeout tra due letture consecutive del body: il default 60s taglierebbe un mittente
    # fermo più a lungo di BASHT_IDLE_TIMEOUT (D15); il limite vero è dell'app.
    client_body_timeout       3600s;
    # Il ricevente può restare in attesa fino a BASHT_WAIT_TIMEOUT (default 1h).
    proxy_read_timeout        3600s;
    proxy_send_timeout        3600s;

    location / {
        proxy_pass http://app:8080;
        # Host originale: la base dei comandi usa r.Host quando BASHT_PUBLIC_URL è vuoto.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
