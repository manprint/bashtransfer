# nginx davanti ad app. Il relay passa per stream (TCP con TLS): l'app risponde con i comandi
# prima di leggere il body, e il proxy HTTP di nginx interrompe il body in quel caso (B-NGX).
# Certificati montati dall'host in /etc/nginx/certs; nessuna gestione certificati nel repository (D12).

# Un solo worker satura male un link veloce: la cifratura TLS è per connessione sul worker.
worker_processes auto;
# Ogni trasferimento usa due socket (client e app).
worker_rlimit_nofile 65536;

events {
    worker_connections 8192;
}

http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}

stream {
    # Il DNS interno di Docker. Con il nome in una variabile nginx risolve a ogni nuova
    # connessione: se il container app viene ricreato e cambia IP, non serve riavviare nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tetto di connessioni simultanee per IP del client: un solo host non può occupare tutte
    # le sessioni dell'app (BASHT_MAX_SESSIONS). Rimuovere le due righe per disattivarlo.
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    server {
        # Keepalive TCP verso il client: 60 s di inattività, poi 4 sonde ogni 15 s. Con i valori di
        # sistema (so_keepalive=on, 2 ore) un mittente caduto durante l'attesa, con dati ancora in
        # volo, terrebbe aperta la sessione verso app per ore: l'app lo rileva solo quando nginx
        # chiude il lato upstream.
        listen 443 ssl so_keepalive=60s:15s:4;

        limit_conn perip 64;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        set $upstream app:8080;
        proxy_pass $upstream;
        # Buffer di copia: il default di 16k costa molte syscall per trasferimenti grandi.
        proxy_buffer_size 128k;
        # Tra due byte consecutivi in qualsiasi direzione. I limiti veri sono dell'app
        # (BASHT_WAIT_TIMEOUT, BASHT_IDLE_TIMEOUT): qui solo un tetto alto, che deve restare
        # sopra BASHT_WAIT_TIMEOUT.
        proxy_timeout 24h;
        proxy_connect_timeout 10s;
    }
}
