# nginx davanti ad app. Il relay passa per stream (TCP con TLS): l'app risponde con i comandi
# prima di leggere il body, e il proxy HTTP di nginx interrompe il body in quel caso (B-NGX).
# Certificati montati dall'host in /etc/nginx/certs; nessuna gestione certificati nel repository (D12).

events {}

http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}

stream {
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_pass app:8080;
        # Tra due byte consecutivi in qualsiasi direzione: copre l'attesa del ricevente (D7)
        # e il silenzio del mittente (D15). Il limite vero resta dell'app.
        proxy_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}
