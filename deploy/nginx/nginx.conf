# nginx in front of app. Relay uses stream (TCP with TLS): app returns commands before
# reading the body, which nginx's HTTP proxy would interrupt (B-NGX).
# Certificates mounted from the host at /etc/nginx/certs; no certificate management here (D12).

# One worker cannot saturate fast links well: TLS encryption runs per connection on the worker.
worker_processes auto;
# Each transfer uses two sockets (client and app).
worker_rlimit_nofile 65536;

events {
    worker_connections 8192;
}

http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}

stream {
    # Docker's internal DNS. A variable hostname is resolved for each new connection:
    # recreating app with a new IP does not require restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Concurrent connection cap per client IP: one host cannot occupy every app session
    # (BASHT_MAX_SESSIONS). Remove the two directives to disable it.
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    server {
        # Client TCP keepalive: 60 s idle, then 4 probes at 15 s intervals. System defaults
        # (so_keepalive=on, 2 hours) let a waiting sender with in-flight data hold the app
        # session open for hours after disconnecting: app detects it only when nginx
        # closes the upstream side.
        listen 443 ssl so_keepalive=60s:15s:4;

        limit_conn perip 64;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        set $upstream app:8080;
        proxy_pass $upstream;
        # Copy buffer: the 16k default causes many syscalls for large transfers.
        proxy_buffer_size 128k;
        # Between consecutive bytes in either direction. Actual limits belong to app
        # (BASHT_WAIT_TIMEOUT, BASHT_IDLE_TIMEOUT): this is only a high cap, which must
        # exceed BASHT_WAIT_TIMEOUT.
        proxy_timeout 24h;
        proxy_connect_timeout 10s;
    }
}
