# Stack bashtransfer: nginx pubblica 80 e 443 (TLS in stream), app resta sulla rete interna senza porte.
# Variabili da impostare sull'host o in un file .env non versionato (vedi README).
services:
  app:
    build: .
    image: bashtransfer:local
    environment:
      BASHT_LISTEN: ":8080"
      BASHT_PUBLIC_URL: ${BASHT_PUBLIC_URL:?impostare BASHT_PUBLIC_URL, es. https://bashtransfer.mydomain.it}
      BASHT_AUTH_USER: ${BASHT_AUTH_USER:-}
      BASHT_AUTH_PASSWORD: ${BASHT_AUTH_PASSWORD:-}
      BASHT_WAIT_TIMEOUT: ${BASHT_WAIT_TIMEOUT:-}
      BASHT_IDLE_TIMEOUT: ${BASHT_IDLE_TIMEOUT:-}
      BASHT_MAX_SESSIONS: ${BASHT_MAX_SESSIONS:-}
      BASHT_BUF_SIZE: ${BASHT_BUF_SIZE:-}
    expose:
      - "8080"
    networks:
      - internal
    restart: unless-stopped
    # Il binario è statico e non scrive su disco: filesystem in sola lettura, nessuna capability.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # I trasferimenti attivi hanno al più 10 s di grazia (shutdownTimeout): stop_grace_period
    # deve restare sopra, altrimenti Docker invia SIGKILL durante l'arresto ordinato.
    stop_grace_period: 15s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${BASHT_CERTS_DIR:?impostare BASHT_CERTS_DIR con fullchain.pem e privkey.pem}:/etc/nginx/certs:ro
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # TCP verso i client (README, "Prestazioni di rete"). Valgono solo nel namespace di rete di
    # nginx, che termina le connessioni di mittente e ricevente; il trasporto verso app è locale.
    # BBR tiene la banda con perdita e RTT alti dove cubic crolla; buffer massimi a 32 MiB per
    # coprire il BDP di 1 Gbit/s fino a ~150 ms. Richiede il modulo tcp_bbr caricato sull'host:
    # un container non può caricarlo.
    sysctls:
      net.ipv4.tcp_congestion_control: ${BASHT_TCP_CC:-bbr}
      net.ipv4.tcp_rmem: "4096 131072 33554432"
      net.ipv4.tcp_wmem: "4096 16384 33554432"
      net.ipv4.tcp_slow_start_after_idle: "0"
    logging: *logging

networks:
  internal: {}
