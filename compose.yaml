# Bashtransfer production stack: nginx exposes 80 and 443 (stream TLS); app stays on an internal
# network without published ports or outbound access. The app image is published by the
# workflow (.github/workflows/image.yml); use compose.build.yaml for a local build.
# Set variables on the host or in an untracked .env file (README, docs/operazioni.md).
services:
  app:
    image: ${BASHT_IMAGE:?set BASHT_IMAGE, e.g. ghcr.io/owner/bashtransfer:1.0.0}
    environment:
      BASHT_LISTEN: ":8080"
      BASHT_PUBLIC_URL: ${BASHT_PUBLIC_URL:?set BASHT_PUBLIC_URL, e.g. https://bashtransfer.mydomain.it}
      BASHT_AUTH_USER: ${BASHT_AUTH_USER:-}
      BASHT_AUTH_PASSWORD: ${BASHT_AUTH_PASSWORD:-}
      BASHT_WAIT_TIMEOUT: ${BASHT_WAIT_TIMEOUT:-}
      BASHT_IDLE_TIMEOUT: ${BASHT_IDLE_TIMEOUT:-}
      BASHT_SENDER_GRACE: ${BASHT_SENDER_GRACE:-}
      BASHT_MAX_SESSIONS: ${BASHT_MAX_SESSIONS:-}
      BASHT_BUF_SIZE: ${BASHT_BUF_SIZE:-}
      # JSON: one object per line, ready for docker logs | jq or a log collector.
      BASHT_LOG_FORMAT: ${BASHT_LOG_FORMAT:-json}
      BASHT_LOG_LEVEL: ${BASHT_LOG_LEVEL:-}
    expose:
      - "8080"
    networks:
      - backend
    restart: unless-stopped
    # Static binary with no disk writes: read-only filesystem, no capabilities.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Active transfers get at most 10 s grace (shutdownTimeout): stop_grace_period must
    # exceed this, otherwise Docker sends SIGKILL during graceful shutdown.
    stop_grace_period: 15s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.30-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${BASHT_CERTS_DIR:?set BASHT_CERTS_DIR with fullchain.pem and privkey.pem}:/etc/nginx/certs:ro
    networks:
      - frontend
      - backend
    restart: unless-stopped
    # Read-only filesystem: nginx writes only pid and temporary files on tmpfs. The master
    # starts as root to read certificates and open 80/443; workers switch to the nginx
    # user: only these capabilities are required.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Graceful shutdown (SIGQUIT): nginx waits for active transfers until
    # stop_grace_period, then Docker sends SIGKILL.
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    # Client-facing TCP (README, "Network performance"). Applies only to nginx's network
    # namespace, where sender and receiver connections terminate; transport to app is local.
    # BBR maintains bandwidth with loss and high RTT where cubic drops; 32 MiB max buffers
    # cover a 1 Gbit/s BDP up to ~150 ms. Requires tcp_bbr loaded on the host:
    # a container cannot load it.
    sysctls:
      net.ipv4.tcp_congestion_control: ${BASHT_TCP_CC:-bbr}
      net.ipv4.tcp_rmem: "4096 131072 33554432"
      net.ipv4.tcp_wmem: "4096 16384 33554432"
      net.ipv4.tcp_slow_start_after_idle: "0"
    logging: *logging

networks:
  # Published ports: nginx only.
  frontend: {}
  # app has no outbound access and is reachable only through nginx.
  backend:
    internal: true
