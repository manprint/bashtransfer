# Stack di produzione bashtransfer: nginx pubblica 80 e 443 (TLS in stream), app resta su una rete
# interna senza porte e senza accesso all'esterno. L'immagine di app è quella pubblicata dal
# workflow (.github/workflows/image.yml); per costruirla in locale: compose.build.yaml.
# Variabili da impostare sull'host o in un file .env non versionato (README, docs/operazioni.md).
services:
  app:
    image: ${BASHT_IMAGE:?impostare BASHT_IMAGE, es. ghcr.io/owner/bashtransfer:1.0.0}
    environment:
      BASHT_LISTEN: ":8080"
      BASHT_PUBLIC_URL: ${BASHT_PUBLIC_URL:?impostare BASHT_PUBLIC_URL, es. https://bashtransfer.mydomain.it}
      BASHT_AUTH_USER: ${BASHT_AUTH_USER:-}
      BASHT_AUTH_PASSWORD: ${BASHT_AUTH_PASSWORD:-}
      BASHT_WAIT_TIMEOUT: ${BASHT_WAIT_TIMEOUT:-}
      BASHT_IDLE_TIMEOUT: ${BASHT_IDLE_TIMEOUT:-}
      BASHT_MAX_SESSIONS: ${BASHT_MAX_SESSIONS:-}
      BASHT_BUF_SIZE: ${BASHT_BUF_SIZE:-}
      # JSON: un oggetto per riga, pronto per docker logs | jq o per un raccoglitore di log.
      BASHT_LOG_FORMAT: ${BASHT_LOG_FORMAT:-json}
      BASHT_LOG_LEVEL: ${BASHT_LOG_LEVEL:-}
    expose:
      - "8080"
    networks:
      - backend
    restart: unless-stopped
    # Il binario è statico e non scrive su disco: filesystem in sola lettura, nessuna capability.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # I trasferimenti attivi hanno al più 10 s di grazia (shutdownTimeout): stop_grace_period
    # deve restare sopra, altrimenti Docker invia SIGKILL durante l'arresto ordinato.
    stop_grace_period: 15s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.30-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${BASHT_CERTS_DIR:?impostare BASHT_CERTS_DIR con fullchain.pem e privkey.pem}:/etc/nginx/certs:ro
    networks:
      - frontend
      - backend
    restart: unless-stopped
    # Filesystem in sola lettura: nginx scrive solo pid e file temporanei, su tmpfs. Il master
    # parte come root per leggere i certificati e aprire 80/443, poi i worker passano all'utente
    # nginx: servono solo queste capability.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Arresto ordinato (SIGQUIT): nginx attende la fine dei trasferimenti in corso fino a
    # stop_grace_period, poi Docker invia SIGKILL.
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    # TCP verso i client (README, "Prestazioni di rete"). Valgono solo nel namespace di rete di
    # nginx, che termina le connessioni di mittente e ricevente; il trasporto verso app è locale.
    # BBR tiene la banda con perdita e RTT alti dove cubic crolla; buffer massimi a 32 MiB per
    # coprire il BDP di 1 Gbit/s fino a ~150 ms. Richiede il modulo tcp_bbr caricato sull'host:
    # un container non può caricarlo.
    sysctls:
      net.ipv4.tcp_congestion_control: ${BASHT_TCP_CC:-bbr}
      net.ipv4.tcp_rmem: "4096 131072 33554432"
      net.ipv4.tcp_wmem: "4096 16384 33554432"
      net.ipv4.tcp_slow_start_after_idle: "0"
    logging: *logging

networks:
  # Porte pubblicate: solo nginx.
  frontend: {}
  # app non raggiunge l'esterno e non è raggiungibile se non da nginx.
  backend:
    internal: true
