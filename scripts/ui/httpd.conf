# Apache 2.4 per scripts/ui/run.sh apache: tre vhost con la configurazione del README ("Dietro
# Apache"), senza TLS, verso tre istanze dell'app sulla rete Docker (attesa lunga, attesa 3s, auth).
ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 80
Listen 81
Listen 82

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule http2_module modules/mod_http2.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http2_module modules/mod_proxy_http2.so

User www-data
Group www-data
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %t \"%m\" %>s %b %D" bashtransfer
CustomLog /proc/self/fd/1 bashtransfer

<VirtualHost *:80>
    Protocols http/1.1
    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyPass         / h2c://bt-ui-app:8080/ flushpackets=on timeout=3600 connectiontimeout=5 retry=0 keepalive=On
    ProxyPassReverse  / h2c://bt-ui-app:8080/
    ProxyIOBufferSize 65536
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    LimitRequestBody  0
    SetEnv no-gzip    1
    SetEnv no-brotli  1
</VirtualHost>

<VirtualHost *:81>
    Protocols http/1.1
    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyPass         / h2c://bt-ui-app-short:8080/ flushpackets=on timeout=3600 connectiontimeout=5 retry=0 keepalive=On
    ProxyPassReverse  / h2c://bt-ui-app-short:8080/
    ProxyIOBufferSize 65536
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    LimitRequestBody  0
    SetEnv no-gzip    1
    SetEnv no-brotli  1
</VirtualHost>

<VirtualHost *:82>
    Protocols http/1.1
    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyPass         / h2c://bt-ui-app-auth:8080/ flushpackets=on timeout=3600 connectiontimeout=5 retry=0 keepalive=On
    ProxyPassReverse  / h2c://bt-ui-app-auth:8080/
    ProxyIOBufferSize 65536
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    LimitRequestBody  0
    SetEnv no-gzip    1
    SetEnv no-brotli  1
</VirtualHost>
